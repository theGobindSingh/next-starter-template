allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Versions published within pnpm's minimum release age (1 day by default).
# Safe to delete once they are older than that (after 2026-10-21).
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.28.2'
  - '@eslint-react/core@5.28.2'
  - '@eslint-react/eslint-plugin@5.28.2'
  - '@eslint-react/eslint@5.28.2'
  - '@eslint-react/jsx@5.28.2'
  - '@eslint-react/shared@5.28.2'
  - '@eslint-react/var@5.28.2'
  - '@webadeva/eslint-config@0.1.2'
  - eslint-plugin-react-dom@5.28.2
  - eslint-plugin-react-jsx@5.28.2
  - eslint-plugin-react-naming-convention@5.28.2
  - eslint-plugin-react-rsc@5.28.2
  - eslint-plugin-react-web-api@5.28.2
  - eslint-plugin-react-x@5.28.2
